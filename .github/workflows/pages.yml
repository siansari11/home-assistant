name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage built site at repository root
        run: sh scripts/stage-pages-root.sh

      - name: Commit built site when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html assets icons favicon.svg manifest.webmanifest sw.js offline.html .nojekyll
          if git ls-files --error-unmatch 'workbox-*.js' >/dev/null 2>&1; then
            git ls-files 'workbox-*.js' | while read -r file; do
              [ -f "$file" ] || git rm -- "$file"
            done
          fi
          git add -- workbox-*.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Built site already matches this commit"
          else
            git commit -m "Publish built site"
            git push
          fi

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
